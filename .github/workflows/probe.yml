# One-off reconnaissance: which chains expose prices without a token?
# Runs only on the probe branch (never on main) and by hand. Read-only.
name: Probe priskilder

on:
  push:
    branches: [probe/prisdata]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe chains
        run: node server/scripts/probe-sources.mjs probe-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-report
          path: probe-out/
