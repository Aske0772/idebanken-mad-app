# Static build for GitHub Pages: the week's prices are scraped here and shipped as
# week.json next to the app, so no server is needed. Runs on every push to main and
# every 6 hours, like the server's own refresh.
name: GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix web
      - name: Build the app
        run: npm run build --prefix web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_WEEK_URL: week.json
      - name: Scrape this week's prices into the build
        run: npm run export --prefix server -- ../web/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
